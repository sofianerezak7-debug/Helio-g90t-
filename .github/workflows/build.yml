
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip Dragon-Burst-Redmi-Note-8-Pro-Compatibility.zip
          cd Dragon-Burst-main
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug -Pdf.uiOnly=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Burst-APK
          path: Dragon-Burst-main/app/build/outputs/apk/debug/*.apk
